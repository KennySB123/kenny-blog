# ═══════════════════════════════════════════════════════════════
# Sveltia CMS configuration
#
# ⚠️ ONE THING TO CHANGE: set `repo` below to your GitHub repo,
# in the form "your-username/your-repo-name".
# Everything else works as-is. See DEPLOY.md step 5.
# ═══════════════════════════════════════════════════════════════

backend:
  name: github
  repo: YOUR-USERNAME/YOUR-REPO # ← change this
  branch: main
  # Lets you log in with GitHub without running your own auth server.
  base_url: https://sveltia-cms-auth.YOUR-SUBDOMAIN.workers.dev # ← see DEPLOY.md step 5b

# Uploaded images go here and are referenced as /images/filename.jpg
media_folder: public/images
public_folder: /images

# Show a "view live" link and a preview of unpublished changes
publish_mode: simple

collections:
  - name: blog
    label: Posts
    label_singular: Post
    folder: src/content/blog
    create: true
    slug: '{{slug}}'
    extension: md
    format: yaml-frontmatter
    preview_path: blog/{{slug}}
    summary: '{{title}} — {{pubDate | date("D MMM YYYY")}}'
    sortable_fields: [pubDate, title]
    view_groups:
      - label: Status
        field: draft
    fields:
      - label: Title
        name: title
        widget: string
        hint: Shows as the page heading and the browser tab title.

      - label: Description
        name: description
        widget: text
        hint: One or two sentences. Used on cards, in search results, and in the RSS feed.

      - label: Publish date
        name: pubDate
        widget: datetime
        date_format: YYYY-MM-DD
        time_format: false
        format: YYYY-MM-DD
        default: ''

      - label: Last updated
        name: updatedDate
        widget: datetime
        date_format: YYYY-MM-DD
        time_format: false
        format: YYYY-MM-DD
        required: false
        hint: Optional. Only fill this in if you meaningfully revise a published post.

      - label: Hero image
        name: heroImage
        widget: image
        required: false
        hint: Optional. Appears at the top of the post.

      - label: Tags
        name: tags
        widget: list
        default: []
        required: false
        hint: Lowercase, no spaces — e.g. web, notes, books.

      - label: Draft
        name: draft
        widget: boolean
        default: true
        hint: Drafts are never published to the live site. Turn this off to publish.

      - label: Body
        name: body
        widget: markdown
