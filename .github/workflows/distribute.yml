# Sends essays to DEV, Hashnode, Bluesky and Mastodon, and asks Claude for a video
# script. Runs when posts change on main, or when you press "Distribute now" in /admin.
name: Distribute

on:
  push:
    branches: [main]
    paths:
      - 'src/content/blog/**'
  workflow_dispatch:
    inputs:
      slug:
        description: Essay slug (the file name without .md)
        required: true
        type: string
      action:
        description: What to do
        required: true
        default: distribute
        type: choice
        options: [distribute, remove, regenerate-script]
      platforms:
        description: Comma-separated platforms (blank = use the settings)
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: distribute
  cancel-in-progress: false

jobs:
  distribute:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: pipeline/package-lock.json

      - name: Install pipeline
        working-directory: pipeline
        run: npm ci --no-audit --no-fund

      - name: Distribute
        working-directory: pipeline
        run: node src/distribute.mjs
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          INPUT_SLUG: ${{ inputs.slug }}
          INPUT_ACTION: ${{ inputs.action }}
          INPUT_PLATFORMS: ${{ inputs.platforms }}
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          HASHNODE_TOKEN: ${{ secrets.HASHNODE_TOKEN }}
          HASHNODE_PUBLICATION_ID: ${{ secrets.HASHNODE_PUBLICATION_ID }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          MASTODON_INSTANCE: ${{ secrets.MASTODON_INSTANCE }}
          MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
